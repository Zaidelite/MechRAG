services:
  - type: web
    name: mech-rag-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_MODEL
        value: groq/compound
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: CHROMA_PERSIST_DIR
        value: /app/data/chroma_db
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
